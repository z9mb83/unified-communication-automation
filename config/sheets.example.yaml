# Exact (spreadsheet ID, tab name) -> brand mapping. Brands are never guessed.
# The existing email workbook and its tabs/columns are preserved exactly:
# lead tabs use A:L with headers on row 2 and data from row 3
# (A Person Name, B Email, C Details, D Subject, E Generated Email, F Send Status,
#  G Sent At, H Error, I Sent From, J Approval, K Gmail Message ID, L Follow-up Status).
#
# Add WhatsApp/SMS tabs either per brand (brand_id) or as one shared tab with a
# validated Brand ID column (brand_column). Column letters are exact.

spreadsheets:
  - spreadsheet_id: "18hjldwZeoQ8Y99ngc02OVpoT_4Pe1rM0nNhS2KPxfOI"   # existing email workbook
    tabs:
      - {tab: "Shaaadibells", brand_id: shaadi, channels: [email], header_row: 2, first_data_row: 3,
         columns: {name: A, email: B, details: C, status: F, approval: J}}
      - {tab: "99marketing", brand_id: marketing, channels: [email], header_row: 2, first_data_row: 3,
         columns: {name: A, email: B, details: C, status: F, approval: J}}
      - {tab: "Staffing", brand_id: staffing, channels: [email], header_row: 2, first_data_row: 3,
         columns: {name: A, email: B, details: C, status: F, approval: J}}
      - {tab: "Property", brand_id: property, channels: [email], header_row: 2, first_data_row: 3,
         columns: {name: A, email: B, details: C, status: F, approval: J}}
      - {tab: "Skyline capital", brand_id: skyline, channels: [email], header_row: 2, first_data_row: 3,
         columns: {name: A, email: B, details: C, status: F, approval: J}}
  # WhatsApp workbook: https://docs.google.com/spreadsheets/d/1cOi3D9b2-rncWkIvQdLeuaHut78hmT_w_r15EcUOWm4/edit
  # One shared contacts tab; every row's Brand ID (column A) must exactly match the brand being sent.
  - spreadsheet_id: "1cOi3D9b2-rncWkIvQdLeuaHut78hmT_w_r15EcUOWm4"
    tabs:
      - {tab: "WhatsApp Contacts", brand_column: A, channels: [whatsapp], header_row: 1, first_data_row: 2,
         columns: {brand: A, name: B, phone: C, details: D, wa_consent: E, wa_consent_date: F, consent_evidence: G}}

  # SMS workbook: https://docs.google.com/spreadsheets/d/105pPI82jrNnx9GsmsG-_vssFI7Z5nrFW62wtAe1Ramk/edit
  - spreadsheet_id: "105pPI82jrNnx9GsmsG-_vssFI7Z5nrFW62wtAe1Ramk"
    tabs:
      - {tab: "SMS Contacts", brand_column: A, channels: [sms], header_row: 1, first_data_row: 2,
         columns: {brand: A, name: B, phone: C, details: D, sms_consent: E, sms_consent_date: F, consent_evidence: G}}
