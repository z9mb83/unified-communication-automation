[project]
name = "unified-communication-automation"
version = "0.1.0"
description = "Unified Email (existing Gmail automation), WhatsApp Cloud API and DLT SMS automation controlled from Google Sheets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "requests>=2.32",
  "google-auth>=2.0.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-tasks>=2.16",
  "google-cloud-secret-manager>=2.20",
  # existing email application (services/email/requirements.txt)
  "openai>=1.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "python-dotenv>=1.0.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "black>=24", "mypy>=1.10", "types-PyYAML", "types-requests",
       "pip-audit>=2.7", "bandit>=1.7"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["node: requires Node.js to execute Apps Script logic"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["services/email/app", "services/email/legacy_local", "services/email/*.py", "services/email/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM"]
ignore = ["S101", "B008", "S603", "S311", "BLE001", "SIM108", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "services", "scripts", "tests"]
known-third-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"scripts/**" = ["S"]

[tool.black]
line-length = 120
target-version = ["py311"]
# The preserved email application keeps its original formatting byte-for-byte.
extend-exclude = "services/email/(app|legacy_local|scripts)/|services/email/[^/]+\\.py$"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["services/email/app/", "services/email/legacy_local/", "services/email/scripts/", "services/email/[^/]+\\.py$", "tests/"]
