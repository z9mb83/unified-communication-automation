name: Deploy production

# Manual only, from main, behind the 'production' environment's required reviewers.
# Deploys uca-api/uca-webhooks/uca-workers. Does NOT touch the existing
# email-sender job, its image or its Cloud Scheduler jobs.
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Commit SHA of an image already verified in staging"
        required: true
      confirm:
        description: 'Type "deploy production" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'deploy production' && vars.GCP_PROJECT_ID != '' }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      ENVIRONMENT: production
      APPS_SCRIPT_CLIENT_ID: ${{ vars.APPS_SCRIPT_CLIENT_ID }}
      EMAIL_RUN_JOB_NAME: ${{ vars.EMAIL_RUN_JOB_NAME }}
      IMAGE: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO || 'uca' }}/uca:${{ inputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Image must exist (built and tested by staging)
        run: gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID"
      - name: Deploy production services
        run: ./infrastructure/cloud-run/deploy.sh
